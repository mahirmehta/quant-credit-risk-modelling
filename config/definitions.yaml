universe:
  country: "USA"
  currency: "USD"
  sample_start: "2002-01-01"
  sample_end: "2025-12-31"
  exclude_sic_ranges:
    - [6000, 6999]  # Financials
    - [4900, 4999]  # Regulated utilities

rating_scale:
  numeric_map:
    AAA: 1
    AA+: 2
    AA: 3
    AA-: 4
    A+: 5
    A: 6
    A-: 7
    BBB+: 8
    BBB: 9
    BBB-: 10
    BB+: 11
    BB: 12
    BB-: 13
    B+: 14
    B: 15
    B-: 16
    CCC+: 17
    CCC: 18
    CCC-: 19
    CC: 20
    C: 21
    D: 22
    SD: 22

  ig_cutoff: 10  # rating_num <= 10 is IG, >= 11 is HY
  fallen_angel_threshold_from: 10
  fallen_angel_threshold_to: 11

  ordinal_buckets:
    AAA_AA: [1, 2, 3, 4]
    A_BAND: [5, 6, 7]
    BBB_PLUS: [8]
    BBB: [9]
    BBB_MINUS: [10]
    BB_PLUS: [11]
    BB: [12]
    BB_MINUS: [13]
    B_PLUS: [14]
    B: [15]
    B_MINUS_BELOW: [16, 17, 18, 19, 20, 21, 22]

horizons:
  primary: 4     # 12 months (4 quarters)
  robustness: [2, 8]

cleaning:
  winsorize_limits: [0.01, 0.99]
  winsorize_on_train_only: true
  nonpos_ebitda_handling: "ceiling_and_flag"

sectors:
  fama_french_12: true
